name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default, and each job asks for what it needs.
# Only the deploy job can write to Pages.
permissions:
  contents: read

# One deploy at a time; don't cancel a run that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    # configure-pages reads the Pages settings (origin and base path) through the API.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap's lastmod dates come from each page's last commit.
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Switch Pages on automatically the first time this runs, so there is
          # nothing to click in Settings.
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The real published URL and sub-path, straight from the Pages settings, so that
        # canonical tags, the sitemap and share cards always match where the site actually lives.
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Must run before the deploy: it diffs the new sitemap against the one still live.
      - name: List new or changed pages for IndexNow
        id: indexnow
        continue-on-error: true
        run: |
          {
            echo "payload<<EOF"
            node scripts/indexnow.mjs "${{ steps.pages.outputs.base_url }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing, Yandex and the other IndexNow engines about the pages that changed.
      # A failure here never fails the deploy: the site is already live.
      - name: Submit changed pages to IndexNow
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary "$PAYLOAD" -w "IndexNow: HTTP %{http_code}\n"
